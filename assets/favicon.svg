<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Hexagon / Squircle -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="#0B0F19" stroke="url(#grad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Glowing S Monogram -->
  <path d="M 64 33 C 64 26 58 22 50 22 C 38 22 34 29 34 37 C 34 50 66 48 66 63 C 66 73 56 78 48 78 C 36 78 32 70 32 63" 
        fill="none" 
        stroke="url(#grad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <!-- Decorative Accent Dots -->
  <circle cx="68" cy="24" r="3.5" fill="#06B6D4" />
  <circle cx="30" cy="76" r="3" fill="#6366F1" />
</svg>
